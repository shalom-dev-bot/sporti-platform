{% load i18n static %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'fr' }}" class="dark">
<head>
    <script>
        // Fixe la hauteur reelle de l'ecran une seule fois, avant le rendu,
        // pour eviter le "saut" du a la barre d'adresse mobile qui se
        // retracte juste apres le chargement (dvh recalculerait en direct).
        (function () {
            function setAppHeight() {
                document.documentElement.style.setProperty("--app-height", window.innerHeight + "px");
            }
            setAppHeight();
            window.addEventListener("resize", setAppHeight);
            window.addEventListener("orientationchange", setAppHeight);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SPORTI{% endblock %}</title>
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <meta name="theme-color" content="#2D6CDF">
    <link rel="stylesheet" href="{% static 'css/dist/sporti.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-surface-light dark:bg-navy-950 text-navy-900 dark:text-white font-body transition-colors duration-300 min-h-screen">
    <nav id="top-utility-bar" class="w-full flex items-center justify-end gap-2 px-4" style="height:3.5rem; background:transparent;">
        <form id="lang-form" action="{% url 'set_language' %}" method="post" class="m-0">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.path }}">
            <input type="hidden" name="language" id="lang-input" value="">
            <button type="submit" id="lang-toggle" aria-label="{% trans 'Changer de langue' %}"
                class="w-10 h-10 rounded-full flex items-center justify-center
                       bg-white dark:bg-navy-850 border border-navy-900/10 dark:border-white/10
                       transition-colors text-lg leading-none">
                {% if LANGUAGE_CODE == "en" %}🇬🇧{% else %}🇫🇷{% endif %}
            </button>
        </form>
        <button
            id="theme-toggle"
            type="button"
            aria-label="{% trans 'Changer de theme' %}"
            class="w-10 h-10 rounded-full flex items-center justify-center
                   bg-white dark:bg-navy-850 border border-navy-900/10 dark:border-white/10
                   transition-colors"
        >
            <svg id="icon-sun" class="w-5 h-5 text-accent-600 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.36 6.36l-.7-.7M6.34 6.34l-.7-.7m12.02 0l-.7.7M6.34 17.66l-.7.7M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            <svg id="icon-moon" class="w-5 h-5 text-accent-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
        </button>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script>
        const html = document.documentElement;
        const iconSun = document.getElementById("icon-sun");
        const iconMoon = document.getElementById("icon-moon");
        function applyTheme(theme) {
            if (theme === "light") {
                html.classList.remove("dark");
                iconSun.classList.remove("hidden");
                iconMoon.classList.add("hidden");
            } else {
                html.classList.add("dark");
                iconSun.classList.add("hidden");
                iconMoon.classList.remove("hidden");
            }
        }
        const savedTheme = localStorage.getItem("sporti-theme") || "dark";
        applyTheme(savedTheme);
        document.getElementById("theme-toggle").addEventListener("click", () => {
            const current = html.classList.contains("dark") ? "dark" : "light";
            const next = current === "dark" ? "light" : "dark";
            localStorage.setItem("sporti-theme", next);
            applyTheme(next);
        });
        const langForm = document.getElementById("lang-form");
        const langInput = document.getElementById("lang-input");
        const langNextInput = langForm ? langForm.querySelector('input[name="next"]') : null;
        if (langForm && langInput) {
            langForm.addEventListener("submit", () => {
                langInput.value = "{{ LANGUAGE_CODE }}" === "en" ? "fr" : "en";
                if (langNextInput) {
                    const strippedPath = window.location.pathname.replace(/^\/(fr|en)(\/|$)/, "/");
                    langNextInput.value = strippedPath || "/";
                }
            });
        }
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register("/service-worker.js").catch(() => {});
            });
        }
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
