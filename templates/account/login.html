{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="min-h-screen bg-[#F4F7FC] dark:bg-[#060913] text-gray-900 dark:text-white flex flex-col justify-center items-center px-4 py-6 relative overflow-hidden transition-colors duration-300">
  
  <!-- Halos lumineux Néon Cyan/Bleu (Glow Esport) -->
  <div class="absolute top-1/4 -left-28 w-80 h-80 bg-[#00A3FF]/20 rounded-full blur-[120px] pointer-events-none"></div>
  <div class="absolute bottom-1/4 -right-28 w-80 h-80 bg-[#0057FF]/20 rounded-full blur-[120px] pointer-events-none"></div>

  <!-- Carte Compacte de Connexion -->
  <div class="w-full max-w-sm bg-white dark:bg-[#0E1626]/95 backdrop-blur-xl border border-gray-200 dark:border-[#00A3FF]/30 rounded-2xl p-6 shadow-xl dark:shadow-[0_0_25px_rgba(0,163,255,0.2)] relative z-10 transition-all duration-300 hover:border-[#00A3FF]/50">
    
    <!-- Logo SPORTI Officiel -->
    <div class="text-center mb-4">
      <img src="{% static 'images/logo.jpeg' %}" alt="SPORTI Logo" class="h-20 mx-auto mb-1 drop-shadow-[0_0_12px_rgba(0,163,255,0.6)] transition-transform duration-300 hover:scale-105 rounded-full">
      <h1 class="text-lg font-black tracking-wider text-gray-900 dark:text-white uppercase">SPORT<span class="text-[#00A3FF]">I</span></h1>
      <p class="text-[9px] font-bold tracking-widest text-[#00A3FF] uppercase">Vision • Speed • Strength</p>
    </div>

    <!-- Bouton Connexion Google -->
    <a href="/accounts/google/login/" class="w-full flex items-center justify-center gap-2 bg-gray-100 hover:bg-gray-200 dark:bg-white dark:hover:bg-gray-100 text-gray-900 font-semibold py-2.5 px-3 rounded-lg shadow-sm transition-all duration-200 border border-gray-300 dark:border-transparent text-xs">
      <svg class="w-4 h-4" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <span>Continuer avec Google</span>
    </a>

    <!-- Séparateur -->
    <div class="relative my-3.5 text-center">
      <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200 dark:border-gray-800"></div></div>
      <span class="relative px-2 bg-white dark:bg-[#0E1626] text-[10px] text-gray-400 uppercase tracking-wider">ou</span>
    </div>

    <!-- Formulaire Email alternatif -->
    <form method="post" action="" class="space-y-3">
      {% csrf_token %}
      <div>
        <label class="block text-[10px] font-bold text-gray-500 dark:text-gray-400 mb-1 uppercase tracking-wider">E-mail</label>
        <input type="email" name="username" required placeholder="nom@exemple.com" class="w-full bg-gray-50 dark:bg-[#060913] border border-gray-200 dark:border-gray-800 focus:border-[#00A3FF] focus:ring-1 focus:ring-[#00A3FF] text-gray-900 dark:text-white rounded-lg px-3 py-2 text-xs outline-none transition duration-200">
      </div>
      <div>
        <label class="block text-[10px] font-bold text-gray-500 dark:text-gray-400 mb-1 uppercase tracking-wider">Mot de passe</label>
        <input type="password" name="password" required placeholder="••••••••" class="w-full bg-gray-50 dark:bg-[#060913] border border-gray-200 dark:border-gray-800 focus:border-[#00A3FF] focus:ring-1 focus:ring-[#00A3FF] text-gray-900 dark:text-white rounded-lg px-3 py-2 text-xs outline-none transition duration-200">
      </div>
      <button type="submit" class="w-full bg-gradient-to-r from-[#0057FF] to-[#00A3FF] hover:from-[#0046CC] hover:to-[#0088DD] text-white font-bold py-2.5 px-3 rounded-lg shadow-[0_0_15px_rgba(0,163,255,0.35)] transition-all duration-200 text-xs uppercase tracking-wider mt-1">
        Se connecter
      </button>
    </form>

    <!-- Lien vers l'Inscription (Sign Up) -->
    <div class="mt-4 text-center border-t border-gray-100 dark:border-gray-800/60 pt-3">
      <p class="text-[11px] text-gray-500 dark:text-gray-400">
        Pas encore de compte ? 
        <a href="/accounts/signup/" class="text-[#00A3FF] font-semibold hover:underline ml-1">S'inscrire</a>
      </p>
    </div>

  </div>
</div>
{% endblock %}
