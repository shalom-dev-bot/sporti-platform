services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sporti
      POSTGRES_PASSWORD: sporti
      POSTGRES_DB: sporti
    ports:
      - "5433:5432"
    volumes:
      - sporti_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sporti"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sporti_db_data:
