{% load i18n %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SPORTI -- Changer le mot de passe</title>
</head>
<body>
    <header>
        <h1>Changer le mot de passe</h1>
        <nav>
            <a href="{% url 'dashboard:home' %}">Vue d'ensemble</a> |
            <a href="{% url 'dashboard:conversations_list' %}">Conversations</a> |
            <a href="{% url 'dashboard:change_password' %}">Mot de passe</a> |
            <a href="{% url 'dashboard:logout' %}">Se deconnecter</a>
        </nav>
    </header>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Modifier le mot de passe</button>
    </form>
</body>
</html>
