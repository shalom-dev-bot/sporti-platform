# Le depot contient du Python (Django) ET du Node (build Tailwind CSS).
# La detection automatique de Nixpacks ne choisit qu'un seul langage
# (Node, a cause de package.json) et ignore Python -- on configure donc
# les phases a la main pour etre certain que les deux soient presents.
[phases.setup]
nixPkgs = ["python312", "nodejs_20"]

[phases.build]
cmds = [
  "python3 -m ensurepip --upgrade",
  "bash build.sh"
]
