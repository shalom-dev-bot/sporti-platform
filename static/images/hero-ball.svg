<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ballon de football SPORTI">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D6CDF" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#2D6CDF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2D6CDF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ballShade" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#f5f7fb"/>
      <stop offset="55%" stop-color="#d7dde8"/>
      <stop offset="100%" stop-color="#8b93a7"/>
    </radialGradient>
    <linearGradient id="streak1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B9BFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5B9BFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5B9BFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streak2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D6CDF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2D6CDF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2D6CDF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="190" fill="url(#glow)"/>

  <g opacity="0.85" filter="url(#softBlur)">
    <path d="M20 90 L380 250" stroke="url(#streak1)" stroke-width="3"/>
    <path d="M40 320 L360 70" stroke="url(#streak2)" stroke-width="3"/>
    <path d="M0 200 L180 40" stroke="url(#streak1)" stroke-width="2"/>
    <path d="M400 200 L220 360" stroke="url(#streak2)" stroke-width="2"/>
  </g>

  <g transform="translate(200,205)">
    <clipPath id="ballClip">
      <circle r="108"/>
    </clipPath>
    <circle r="108" fill="url(#ballShade)"/>

    <g clip-path="url(#ballClip)" fill="none" stroke="#161a2b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="0,-34 32.3,-10.5 19.9,27.5 -19.9,27.5 -32.3,-10.5" fill="#161a2b" stroke="none"/>
      <line x1="0" y1="-34" x2="0" y2="-112"/>
      <line x1="32.3" y1="-10.5" x2="106.4" y2="-34.6"/>
      <line x1="19.9" y1="27.5" x2="65.8" y2="90.8"/>
      <line x1="-19.9" y1="27.5" x2="-65.8" y2="90.8"/>
      <line x1="-32.3" y1="-10.5" x2="-106.4" y2="-34.6"/>
      <path d="M 0,-112 A 108 108 0 0 1 106.4,-34.6" stroke-width="2.5"/>
      <path d="M 106.4,-34.6 A 108 108 0 0 1 65.8,90.8" stroke-width="2.5"/>
      <path d="M 65.8,90.8 A 108 108 0 0 1 -65.8,90.8" stroke-width="2.5"/>
      <path d="M -65.8,90.8 A 108 108 0 0 1 -106.4,-34.6" stroke-width="2.5"/>
      <path d="M -106.4,-34.6 A 108 108 0 0 1 0,-112" stroke-width="2.5"/>
      <polygon points="0,-112 32,-98 20,-70 -20,-70 -32,-98" fill="#161a2b" stroke="none" opacity="0.9"/>
      <polygon points="106.4,-34.6 100,-2 68,-6 72,-38 92,-52" fill="#161a2b" stroke="none" opacity="0.9"/>
      <polygon points="65.8,90.8 40,98 22,72 46,52 66,60" fill="#161a2b" stroke="none" opacity="0.9"/>
      <polygon points="-65.8,90.8 -40,98 -22,72 -46,52 -66,60" fill="#161a2b" stroke="none" opacity="0.9"/>
      <polygon points="-106.4,-34.6 -100,-2 -68,-6 -72,-38 -92,-52" fill="#161a2b" stroke="none" opacity="0.9"/>
    </g>

    <circle r="108" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
    <ellipse cx="-34" cy="-46" rx="26" ry="14" fill="#ffffff" opacity="0.35"/>
  </g>

  <circle transform="translate(200,205)" r="108" fill="none" stroke="#2D6CDF" stroke-opacity="0.35" stroke-width="1.5"/>

  <g opacity="0.9">
    <circle cx="60" cy="60" r="2.5" fill="#5B9BFF"/>
    <circle cx="345" cy="95" r="2" fill="#5B9BFF"/>
    <circle cx="330" cy="310" r="2.5" fill="#2D6CDF"/>
    <circle cx="55" cy="330" r="2" fill="#2D6CDF"/>
    <circle cx="200" cy="20" r="1.8" fill="#5B9BFF"/>
  </g>
</svg>
