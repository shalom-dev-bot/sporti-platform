<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPORTI — Communication Client</title>
  
  <!-- CDN Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            sporti: {
              bg: '#060913',       // Fond ultra sombre
              card: '#0E1626',     // Fond des cartes
              primary: '#0057FF',  // Bleu principal
              neon: '#00A3FF',     // Bleu néon
              silver: '#E2E8F0',   // Argent clair
            }
          },
          boxShadow: {
            'neon-glow': '0 0 20px rgba(0, 163, 255, 0.4)',
            'neon-lg': '0 0 35px rgba(0, 163, 255, 0.6)',
          }
        }
      }
    }
  </script>

  <!-- Script pour mémoriser le thème -->
  <script>
    if (localStorage.theme === 'light' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: light)').matches)) {
      document.documentElement.classList.remove('dark')
    } else {
      document.documentElement.classList.add('dark')
    }
  </script>
</head>

<body class="bg-[#F4F7FC] dark:bg-[#060913] text-gray-900 dark:text-white transition-colors duration-300 min-h-screen font-sans">

  <!-- BOUTON FLOTTANT SWITCH THÈME (Pro & Stylisé) -->
  <button id="theme-toggle" class="fixed bottom-6 right-6 z-50 bg-[#0E1626] dark:bg-white text-white dark:text-[#060913] p-3.5 rounded-2xl shadow-[0_0_20px_rgba(0,163,255,0.4)] border border-[#00A3FF]/40 transition-all duration-300 hover:scale-110 flex items-center justify-center">
    <!-- Icône Soleil (Mode Clair) -->
    <svg id="theme-toggle-light-icon" class="w-5 h-5 hidden dark:block text-[#00A3FF]" fill="currentColor" viewBox="0 0 20 20">
      <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z"></path>
    </svg>
    <!-- Icône Lune (Mode Sombre) -->
    <svg id="theme-toggle-dark-icon" class="w-5 h-5 block dark:hidden text-[#0057FF]" fill="currentColor" viewBox="0 0 20 20">
      <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
    </svg>
  </button>

  <!-- Contenu des pages -->
  {% block content %}
  {% endblock %}

  <!-- JS du Switch de Thème -->
  <script>
    const themeToggleBtn = document.getElementById('theme-toggle');

    themeToggleBtn.addEventListener('click', function() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
    });
  </script>
</body>
</html>
